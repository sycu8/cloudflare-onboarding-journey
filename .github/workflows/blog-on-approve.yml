# After editor APPROVE (link/email → D1), open scaffold PR.
# Polls D1 with CLOUDFLARE_API_TOKEN from the `production` GitHub Environment.
# One slug failing does not abort the rest. The job fails at the end if any slug failed.
# Pushes are never forced. See scripts/blog-on-approve.mjs.

name: Blog on approve

on:
  repository_dispatch:
    types: [blog-approved]
  schedule:
    # Pick up D1 approvals shortly after editor clicks Approve
    - cron: '20,50 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Schedule date YYYY-MM-DD (optional if polling D1; pair with slug)
        required: false
        default: ''
      slug:
        description: Post slug (optional if polling D1; pair with date)
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-on-approve
  cancel-in-progress: false

env:
  D1_DATABASE_ID: df92a9b8-1410-41c3-8d95-ee0f9ebf84ca
  CF_ACCOUNT_ID_FALLBACK: 4c15704ef706b9c8954cd6f9feb678d8

jobs:
  open-pr:
    name: Scaffold blog PR(s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the default branch. blog/<slug> is fetched explicitly
          # in scripts/blog-on-approve.mjs. A depth-1 checkout left the lease
          # comparison pointed at origin/main, so the update was rejected as
          # stale info and every later slug was aborted.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Scaffold + open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKSHOP_EMAIL_FROM: ${{ secrets.WORKSHOP_EMAIL_FROM }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          CF_ACCOUNT_ID_FALLBACK: ${{ env.CF_ACCOUNT_ID_FALLBACK }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DATE: ${{ github.event.client_payload.date }}
          DISPATCH_SLUG: ${{ github.event.client_payload.slug }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: node scripts/blog-on-approve.mjs

# Daily blog generation schedule (1 post / day, Vietnam time)
#
# Opens (or updates) a GitHub issue with the day's topic from src/data/blogSchedule.ts
# so maintainers / Cursor agents can generate the bilingual article.

name: Blog daily generate

on:
  schedule:
    # 00:05 Asia/Ho_Chi_Minh = 17:05 UTC previous calendar day
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Override date YYYY-MM-DD (Asia/Ho_Chi_Minh). Empty = today.
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: blog-daily-generate
  cancel-in-progress: false

jobs:
  open-issue:
    name: Open daily blog generate issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve today's assignment
        id: assign
        env:
          OVERRIDE_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          ARGS=(--json)
          if [ -n "${OVERRIDE_DATE:-}" ]; then
            ARGS+=(--date="$OVERRIDE_DATE")
          fi
          npx tsx scripts/blog-daily.mjs "${ARGS[@]}" > /tmp/blog-today.json || true
          cat /tmp/blog-today.json
          OK=$(node -e "const j=require('/tmp/blog-today.json'); process.stdout.write(j.ok===false?'false':'true')")
          if [ "$OK" != "true" ]; then
            echo "has_item=false" >> "$GITHUB_OUTPUT"
            echo "No schedule item — extend src/data/blogSchedule.ts"
            exit 0
          fi
          DATE=$(node -e "console.log(require('/tmp/blog-today.json').item.date)")
          SLUG=$(node -e "console.log(require('/tmp/blog-today.json').item.slug)")
          STATUS=$(node -e "console.log(require('/tmp/blog-today.json').status)")
          TITLE_EN=$(node -e "console.log(require('/tmp/blog-today.json').item.workingTitle.en)")
          echo "has_item=true" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "title_en=$TITLE_EN" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.assign.outputs.has_item == 'true'
        run: |
          npx tsx scripts/blog-daily.mjs --issue-body --date="${{ steps.assign.outputs.date }}" > /tmp/blog-issue.md
          {
            echo ""
            echo "---"
            echo ""
            echo "<!-- blog-daily:${{ steps.assign.outputs.date }} -->"
            echo ""
            echo "_Opened by workflow \`Blog daily generate\` (cron 00:05 ICT / workflow_dispatch)._"
          } >> /tmp/blog-issue.md

      - name: Create or comment on issue
        if: steps.assign.outputs.has_item == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = '${{ steps.assign.outputs.date }}';
            const slug = '${{ steps.assign.outputs.slug }}';
            const status = '${{ steps.assign.outputs.status }}';
            const titleEn = ${{ toJSON(steps.assign.outputs.title_en) }};
            const body = fs.readFileSync('/tmp/blog-issue.md', 'utf8');
            const marker = `<!-- blog-daily:${date} -->`;
            const issueTitle = `Blog daily ${date}: ${slug}`;

            if (status === 'published') {
              core.notice(`Schedule item ${slug} already published — skipping new issue.`);
              return;
            }

            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "Blog daily ${date}"`;
            const search = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
            const existing = search.data.items.find((i) => i.title.includes(date));

            const labels = ['blog', 'content'];
            // Ensure labels exist (ignore failures)
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: name === 'blog' ? 'F6821F' : '0E8A16',
                  });
                } catch (_) {}
              }
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `## Reminder (workflow re-ran)\n\nStatus: \`${status}\`\n\n${marker}\n\n---\n\n${body}`,
              });
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              core.info(`Updated existing issue #${existing.number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body,
              labels,
            });
            core.info(`Created issue #${issue.data.number}: ${titleEn}`);

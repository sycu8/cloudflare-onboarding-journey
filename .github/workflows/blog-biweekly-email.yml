# Every-3-days blog editorial email (cron daily; only sends on schedule dates)
#
# Reuses Deploy credentials from the `production` GitHub Environment:
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# Sends ONE email to sycu.lee@gmail.com (Approve link + Reply APPROVE).

name: Blog every-3-days email

on:
  schedule:
    # 00:05 Asia/Ho_Chi_Minh = 17:05 UTC previous calendar day
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: >
          Schedule date YYYY-MM-DD, or comma-separated dates, for a missed slot.
          Empty = today in Asia/Ho_Chi_Minh. Ignored when slug is set, unless you
          pass the same number of dates and slugs.
        required: false
        default: ''
      slug:
        description: >
          Post slug, or comma-separated slugs, for a missed approval email.
          Example: hyperdrive-ket-noi-postgres-nhanh-hon,browser-rendering-chup-va-tuong-tac-trang
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blog-biweekly-email
  cancel-in-progress: false

env:
  D1_DATABASE_ID: df92a9b8-1410-41c3-8d95-ee0f9ebf84ca
  # Public account id fallback (also stored as Actions secret on production env)
  CF_ACCOUNT_ID_FALLBACK: 4c15704ef706b9c8954cd6f9feb678d8

jobs:
  email-editor:
    name: Email every-3-days blog assignment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same env as Deploy → production so CLOUDFLARE_* secrets resolve
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build email payload
        id: mail
        env:
          OVERRIDE_DATE: ${{ inputs.date }}
          OVERRIDE_SLUG: ${{ inputs.slug }}
          BLOG_EDITOR_EMAIL: sycu.lee@gmail.com
          BLOG_APPROVE_INBOX: blog-approve@orangecloud.vn
          PUBLIC_SITE_URL: https://onboarding.orangecloud.vn
        run: |
          set -euo pipefail
          ARGS=(--email-body)
          if [ -n "${OVERRIDE_SLUG:-}" ]; then
            ARGS+=(--slug="$OVERRIDE_SLUG")
          fi
          if [ -n "${OVERRIDE_DATE:-}" ]; then
            ARGS+=(--date="$OVERRIDE_DATE")
          fi
          node scripts/blog-editorial.mjs "${ARGS[@]}" > /tmp/blog-email.json
          node -e "const j=require('/tmp/blog-email.json'); if (j.ok===false) { console.log(j.error||'no slot'); process.exit(0);} const msgs=Array.isArray(j.messages)?j.messages:[]; for (const m of msgs) console.log(m.skip?'skip':'send', m.item&&m.item.date, m.item&&m.item.slug, m.reason||'');"
          SKIP=$(node -e "const j=require('/tmp/blog-email.json'); const msgs=Array.isArray(j.messages)?j.messages:(j.email?[j]:[]); const send=msgs.some(m=>m && !m.skip); process.stdout.write(j.ok===false?'noslot':(send?'false':'true'))")
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "noslot" ]; then
            echo "No every-3-days slot today — OK"
          fi

      - name: Record approve token in D1
        if: steps.mail.outputs.skip == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          CF_ACCOUNT_ID_FALLBACK: ${{ env.CF_ACCOUNT_ID_FALLBACK }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/blog-email.json', 'utf8'));
          const messages = (Array.isArray(j.messages) ? j.messages : j.email ? [j] : []).filter((m) => m && !m.skip);
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || process.env.CF_ACCOUNT_ID_FALLBACK;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const dbId = process.env.D1_DATABASE_ID;
          if (!accountId || !token) {
            console.error('Missing CLOUDFLARE_API_TOKEN (and account id). Use GitHub Environment "production" secrets.');
            process.exit(1);
          }
          (async () => {
            for (const message of messages) {
            const date = message.email.item.date;
            const slug = message.email.item.slug;
            const approveToken = message.token;
            const res = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  sql: `INSERT INTO blog_editorial (date, slug, status, token_nonce, note, created_at, updated_at)
                        VALUES (?, ?, 'emailed', ?, 'emailed_by_actions', datetime('now'), datetime('now'))
                        ON CONFLICT(date, slug) DO UPDATE SET
                          status = CASE WHEN blog_editorial.status IN ('pr_opened','published','approved') THEN blog_editorial.status ELSE 'emailed' END,
                          token_nonce = excluded.token_nonce,
                          note = excluded.note,
                          updated_at = datetime('now')`,
                  params: [date, slug, approveToken],
                }),
              },
            );
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) {
              console.error(res.status, JSON.stringify(data, null, 2));
              process.exit(1);
            }
            console.log('Stored approve token in D1 for', date, slug);
            }
          })();
          NODE

      - name: Send email via Cloudflare Email API
        if: steps.mail.outputs.skip == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKSHOP_EMAIL_FROM: ${{ secrets.WORKSHOP_EMAIL_FROM }}
          CF_ACCOUNT_ID_FALLBACK: ${{ env.CF_ACCOUNT_ID_FALLBACK }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/blog-email.json', 'utf8'));
          const messages = (Array.isArray(j.messages) ? j.messages : j.email ? [j] : []).filter((m) => m && !m.skip);
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || process.env.CF_ACCOUNT_ID_FALLBACK;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const from = process.env.WORKSHOP_EMAIL_FROM || 'Cloudflare Starter Hub <onboarding@orangecloud.vn>';
          if (!accountId || !token) {
            console.error('Missing CLOUDFLARE_API_TOKEN (and account id). Use GitHub Environment "production" secrets.');
            process.exit(1);
          }
          function fromPayload(raw) {
            const m = raw.match(/^(.+?)\s*<([^>]+)>$/);
            if (m) return { name: m[1].trim(), address: m[2].trim() };
            return raw.trim();
          }
          (async () => {
            for (const message of messages) {
            const email = message.email;
            const res = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/email/sending/send`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  to: email.to,
                  from: fromPayload(from),
                  reply_to: email.replyTo,
                  subject: email.subject,
                  html: email.html,
                  text: email.text,
                }),
              },
            );
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) {
              console.error(res.status, JSON.stringify(data, null, 2));
              process.exit(1);
            }
            console.log('Sent editorial email to', email.to, 'slug', email.item.slug);
            }
          })();
          NODE
